# Local development stack: `docker compose up --build`
#
#   Web app  http://localhost:5173
#   API      http://localhost:8000/api/v1
#   Mailpit  http://localhost:8025   (catches the sales inbox emails)

x-backend-env: &backend-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  LOG_CHANNEL: stderr
  DB_CONNECTION: sqlite
  DB_DATABASE: /app/storage/data/database.sqlite
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  SALES_INBOX_ADDRESS: ${SALES_INBOX_ADDRESS:-sales@example.com}
  CORS_ALLOWED_ORIGINS: http://localhost:5173

services:
  api:
    build: ./backend
    image: product-catalogue-backend
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - backend-data:/app/storage/data
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Sends the queued enquiry emails.
  queue:
    image: product-catalogue-backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    environment:
      <<: *backend-env
    volumes:
      - backend-data:/app/storage/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  backend-data:
